spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.show-sql=false

spring.devtools.restart.enabled=false

jwt.secret=testSecretKeyForJwtTestingWithEnoughLength32Chars
jwt.expiration=3600000
remember.me.key=testRememberMeKey

logging.level.root=WARN
logging.level.com.biblioteca.escolarbiblioteca=INFO
