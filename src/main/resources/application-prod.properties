# =====================================================================
# Perfil PROD — se activa con:  --spring.profiles.active=prod
#   o variable de entorno:      SPRING_PROFILES_ACTIVE=prod
# Quitar el logging DEBUG/TRACE y el show-sql del modo desarrollo.
# =====================================================================

# JPA
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging (sin DEBUG/TRACE)
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.biblioteca.escolarbiblioteca=INFO

# Swagger solo en desarrollo
springdoc.swagger-ui.enabled=false

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
app.bootstrap.minimum-password-length=12
app.seed-demo-data=${SEED_DEMO_DATA:false}
springdoc.api-docs.enabled=false
spring.flyway.baseline-on-migrate=false
