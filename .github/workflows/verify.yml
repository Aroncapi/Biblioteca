name: Verificar biblioteca
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: biblioteca_test_local
          MYSQL_DATABASE: biblioteca_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pbiblioteca_test_local"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      MYSQL_TEST_URL: jdbc:mysql://localhost:3306/biblioteca_test?allowPublicKeyRetrieval=true&useSSL=false
      MYSQL_TEST_USERNAME: root
      MYSQL_TEST_PASSWORD: biblioteca_test_local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build:spring
        working-directory: frontend
      - run: chmod +x mvnw
      - run: ./mvnw -B -Pmysql-it verify
      - run: docker build -t biblioteca:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-pruebas
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
