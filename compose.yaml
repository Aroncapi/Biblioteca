services:
  mysql:
    image: mysql:8.0.46
    environment:
      MYSQL_DATABASE: biblioteca_escolar
      MYSQL_USER: biblioteca
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerido}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD requerido}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -uroot --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
  app:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/biblioteca_escolar?serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: biblioteca
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerido}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@biblioteca.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD requerido}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql-data:
